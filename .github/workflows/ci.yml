name: CI/CD

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  schedule:
    - cron: '0 2 * * 1'   # weekly security scan — Monday 2am UTC

# Cancel in-progress runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# SECRETS REQUIRED
#
# Repository → Settings → Secrets → Actions:
#   JWT_SECRET_CI          any string, used for test runs only
#
# Production runs on Render (render.yaml), not this workflow — Render deploys natively
# from its own GitHub integration when its configured branch is pushed. This workflow
# only verifies the code; it does not deploy it. See samjhana-three-env-plan-v2.docx.
#
# The staging and production Render services hold their own SUPABASE_STAGING_*/
# SUPABASE_PROD_*, JWT_SECRET and OCPP_SECRET_* values directly in each service's own
# environment settings — never in this repository, never in this file.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Secret scan — runs first, blocks everything if it fails ─────────────
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 1 — fast pre-checks. Cheap, fail-fast. Stage 2 does not start
  # until every job below has passed.
  # ═══════════════════════════════════════════════════════════════════════

  lint-admin:
    name: Lint (samjhana-admin)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samjhana-admin/package-lock.json
      - run: npm ci
        working-directory: samjhana-admin
      - run: npm run lint
        working-directory: samjhana-admin

  lint-web:
    name: Lint (samjhana-web)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samjhana-web/package-lock.json
      - run: npm ci
        working-directory: samjhana-web
      - run: npm run lint
        working-directory: samjhana-web

  audit-admin:
    name: Dependency Audit (samjhana-admin)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samjhana-admin/package-lock.json
      - run: npm ci
        working-directory: samjhana-admin
      - name: npm audit (production deps, moderate and above blocks the merge)
        run: npm audit --audit-level=moderate --omit=dev
        working-directory: samjhana-admin

  audit-web:
    name: Dependency Audit (samjhana-web)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samjhana-web/package-lock.json
      - run: npm ci
        working-directory: samjhana-web
      - name: npm audit (production deps, moderate and above blocks the merge)
        run: npm audit --audit-level=moderate --omit=dev
        working-directory: samjhana-web

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2 — full verification. Only starts once every Stage 1 job above
  # has passed.
  # ═══════════════════════════════════════════════════════════════════════

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-admin, lint-web, audit-admin, audit-web]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run unit tests
        run: |
          mvn test --no-transfer-progress -Pdev \
            -Dtest="*StrategyTest,*EngineTest,*ServiceTest,*UtilTest" \
            -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 7

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run integration tests
        run: |
          mvn test --no-transfer-progress -Pdev \
            -Dtest="*IntegrationTest,*ControllerTest" \
            -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: target/surefire-reports/
          retention-days: 7

  backend-coverage:
    name: Backend Coverage Gate
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run all tests with JaCoCo coverage
        run: mvn verify --no-transfer-progress -Pdev
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  frontend-admin-tests:
    name: Admin Frontend Tests (samjhana-admin)
    runs-on: ubuntu-latest
    needs: [lint-admin, lint-web, audit-admin, audit-web]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samjhana-admin/package-lock.json
      - run: npm ci
        working-directory: samjhana-admin
      - name: Vitest — unit + component tests
        run: npm test
        working-directory: samjhana-admin

  frontend-web-tests:
    name: Public Frontend Tests (samjhana-web)
    runs-on: ubuntu-latest
    needs: [lint-admin, lint-web, audit-admin, audit-web]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: samjhana-web/package-lock.json
      - run: npm ci
        working-directory: samjhana-web
      - name: Vitest — component tests
        run: npm test
        working-directory: samjhana-web

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs:
      - backend-coverage
      - frontend-admin-tests
      - frontend-web-tests
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            samjhana-admin/package-lock.json
            samjhana-web/package-lock.json
      - name: Build admin frontend
        run: npm ci && npm run build
        working-directory: samjhana-admin
      - name: Build public frontend
        # Required, blocking step — a broken public build (audit finding F27) must never
        # again reach staging or main unnoticed.
        run: npm ci && npm run build
        working-directory: samjhana-web
      - name: Build production JAR
        run: mvn clean package -DskipTests --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: prod
          # This step only proves the JAR packages; it never starts Spring, so a real
          # database connection is not needed here.
          SPRING_DATASOURCE_URL: jdbc:h2:mem:buildcheck
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventures-os-jar
          path: target/*.jar
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 3 — automated review, in parallel with Stage 2, non-blocking.
  # ═══════════════════════════════════════════════════════════════════════
  #
  # No job here: an AI code-review tool (CodeRabbit or an equivalent) needs its own
  # GitHub App installed on this repository, which is an account/permission action for
  # a human to grant, not something a workflow file can configure. Once installed, it
  # reviews every PR on its own — no job in this file is needed to invoke it.

  # ── Weekly deep security scan — unchanged ────────────────────────────────
  security-weekly:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit — admin frontend
        run: npm ci && npm audit --audit-level=moderate
        working-directory: samjhana-admin
        continue-on-error: true
      - name: npm audit — public frontend
        run: npm ci && npm audit --audit-level=moderate
        working-directory: samjhana-web
        continue-on-error: true
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: samjhana-ventures-os
          path: '.'
          format: HTML
          args: --failOnCVSS 7 --enableRetired
      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java, javascript
          queries: security-extended
      - name: Build for CodeQL
        run: mvn clean package -DskipTests --no-transfer-progress
        env:
          JWT_SECRET: ci-placeholder
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3
      - name: Notify on scan failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly security scan found issues — ${new Date().toISOString().split('T')[0]}`,
              body: `The weekly OWASP/CodeQL scan detected issues.\n\n` +
                    `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security']
            })

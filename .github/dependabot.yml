# Weekly PRs for dependency updates, including security fixes. They target staging, like every other
# change, and go through the full CI run before anyone merges them.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework*"]

  - package-ecosystem: npm
    directory: /samjhana-admin
    target-branch: staging
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /samjhana-web
    target-branch: staging
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tools/ocpp-simulator
    target-branch: staging
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule: { interval: weekly }

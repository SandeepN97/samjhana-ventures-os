<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdminConfirmDialog preview</title>
<link rel="stylesheet" href="../../preview/admin.css">
</head>
<body class="bg-gray-100 p-0">
<div class="bg-black/50 p-4"><div role="alertdialog" aria-label="Delete this sale? This cannot be undone." class="mx-auto w-full max-w-sm rounded-xl bg-white p-5 shadow-xl">
  <p class="mb-4 text-lg text-gray-800">Delete this sale? This cannot be undone.</p>
  <div class="flex gap-3">
    <button type="button" class="min-h-[44px] flex-1 rounded-lg font-bold text-white bg-red-600 hover:bg-red-700">Delete</button>
    <button type="button" class="min-h-[44px] flex-1 rounded-lg border-2 border-gray-300 font-bold text-gray-700 hover:bg-gray-50">Keep</button>
  </div>
</div></div>
<div class="bg-black/50 p-4"><div role="alertdialog" aria-label="Close the day with these totals?" class="mx-auto w-full max-w-sm rounded-xl bg-white p-5 shadow-xl">
  <p class="mb-4 text-lg text-gray-800">Close the day with these totals?</p>
  <div class="flex gap-3">
    <button type="button" class="min-h-[44px] flex-1 rounded-lg font-bold text-white bg-gray-800 hover:bg-gray-700">Close day</button>
    <button type="button" class="min-h-[44px] flex-1 rounded-lg border-2 border-gray-300 font-bold text-gray-700 hover:bg-gray-50">Not yet</button>
  </div>
</div></div>
</body>
</html>

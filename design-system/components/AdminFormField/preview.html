<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdminFormField preview</title>
<link rel="stylesheet" href="../../preview/admin.css">
</head>
<body class="bg-gray-100 p-4">
<div class="mx-auto max-w-md space-y-4 rounded-xl bg-white p-4 shadow-sm">
<div><label class="block text-sm font-medium text-gray-700 mb-1">Customer name</label><input class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-furniture-500" value="Sita Gurung" aria-label="Customer name"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Phone</label><input class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-core-500" placeholder="98XXXXXXXX" aria-label="Phone"></div>
<div><label class="block text-lg font-medium text-gray-700 mb-2">Litres sold</label><input class="bill-input" inputmode="decimal" value="25.5" aria-label="Litres sold"></div>
<div><label class="block text-lg font-medium text-gray-700 mb-2">Amount</label><input class="w-full px-4 py-3 text-lg border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-core-500" value="3,825" aria-label="Amount"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Payment</label><select class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-rental-500" aria-label="Payment"><option>Cash</option><option>eSewa</option><option>Bank transfer</option></select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Reference</label><input class="w-full px-3 py-2 border-2 border-red-400 rounded-lg focus:outline-none" aria-label="Reference" aria-invalid="true"><p class="text-red-500 text-sm mt-1">Enter the transaction reference.</p></div>
<label class="flex min-h-[44px] items-center gap-3 text-gray-700"><input type="checkbox" class="h-5 w-5 accent-core-800" checked><span>Paid in full</span></label>
<div class="bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded-lg text-sm" role="alert">Could not save. Check the connection and try again.</div>
</div>
</body>
</html>

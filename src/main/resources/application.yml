# =============================================================================
# SAMJHANA VENTURES OS - Application Configuration
# =============================================================================
# This is the main configuration file for the family business ERP system.
# The system is designed to run as a single JAR with embedded H2 database.
# =============================================================================

spring:
  application:
    name: Samjhana Ventures OS

  # =============================================================================
  # Database Configuration (H2 File-based for local dev — prod uses PostgreSQL)
  # Set DB_PASSWORD env var. The absence of a fallback default is intentional:
  # running without DB_PASSWORD in dev uses an empty string for the embedded H2,
  # which is acceptable for local-only data. Never run prod without DATABASE_PASSWORD.
  # =============================================================================
  datasource:
    url: jdbc:h2:file:./data/samjhana-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false

  # =============================================================================
  # JPA/Hibernate Configuration
  # =============================================================================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        types:
          print:
            banner: false

  # =============================================================================
  # File Upload Configuration
  # =============================================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # =============================================================================
  # Jackson JSON Configuration
  # =============================================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    time-zone: Asia/Kathmandu

# =============================================================================
# Server Configuration
# =============================================================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# =============================================================================
# Application-Specific Configuration
# =============================================================================
samjhana:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5175,http://localhost:8080

  security:
    jwt:
      # REQUIRED in production — set JWT_SECRET env var to a random 32+ byte value.
      # The dev fallback below is only for local development; it must never reach prod.
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-CHANGE-IN-PRODUCTION}
      expiration-hours: 168  # 7 days for Dad's convenience
      # Per-address login limits (see LoginAttemptService). OFF until the address the server sees has been
      # checked: log in as admin, open GET /api/auth/my-address, compare it with your real address, then set
      # SAMJHANA_LOGIN_IP_LIMITS=true. SAMJHANA_TRUSTED_PROXY_HOPS is how many entries, counted from the right of
      # X-Forwarded-For, belong to trusted proxies rather than the visitor (0 = the right-most entry is the client).
    login:
      ip-limits-enabled: ${SAMJHANA_LOGIN_IP_LIMITS:false}
    trusted-proxy-hops: ${SAMJHANA_TRUSTED_PROXY_HOPS:0}

  storage:
    images:
      path: ./data/images
      max-size-mb: 10
      allowed-extensions: jpg,jpeg,png,gif,webp

  business:
    default-timezone: Asia/Kathmandu
    currency: NPR

  i18n:
    default-locale: ne
    supported-locales: ne,en

  fuel-price-scraper:
    enabled: true
    depot: Bhalbari
    url: https://noc.org.np

  ocpp:
    default-lock-behavior: ${OCPP_LOCK_BEHAVIOR:EXPLICIT_UNLOCK}
    station-secrets:
      HD-D180-CC-01: ${OCPP_SECRET_HD_D180_CC_01:dev-HD-D180-CC-01-change-me}
      HQC23-80-01: ${OCPP_SECRET_HQC23_80_01:dev-HQC23-80-01-change-me}
      HD-D140-E-01: ${OCPP_SECRET_HD_D140_E_01:dev-HD-D140-E-01-change-me}

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level:
    root: INFO
    com.samjhana: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  file:
    name: ./logs/samjhana-os.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# =============================================================================
# Springdoc OpenAPI Configuration
# =============================================================================
# Off unless the dev profile turns it on: the docs list every endpoint and its fields, which is
# a map for anyone probing staging or prod (and any signed-in user could open them there).
springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

---
# =============================================================================
# Development Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev

  h2:
    console:
      enabled: true
      settings:
        # Local machine only: the console runs any SQL (and, through CREATE ALIAS, Java), so it
        # must not be reachable from other devices on the same Wi-Fi.
        web-allow-others: false

  jpa:
    show-sql: true

server:
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.samjhana: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# =============================================================================
# Production Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # sslmode=verify-full, not just require: require only encrypts, it accepts ANY certificate
    # (including a forged one from a MITM), since it never checks who signed it or whether the
    # hostname matches. verify-full checks both, which is what actually stops a MITM. The
    # PostgreSQL driver checks against its own CA file, not the JVM truststore, and fails with
    # "Could not open SSL root certificate file" without one: upload Supabase's CA certificate
    # (Project Settings -> Database -> SSL Configuration) as a Render Secret File named
    # supabase-ca.crt, or point SUPABASE_SSL_ROOT_CERT at wherever it lives.
    url: jdbc:postgresql://${SUPABASE_PROD_HOST}/${SUPABASE_PROD_DB}?sslmode=verify-full&sslrootcert=${SUPABASE_SSL_ROOT_CERT:/etc/secrets/supabase-ca.crt}
    username: ${SUPABASE_PROD_USER}
    password: ${SUPABASE_PROD_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      # Left overridable via Render's own DDL_AUTO env var (unlike staging, which hardcodes
      # validate) because this Supabase project starts empty: DDL_AUTO=update is needed for
      # the first boot to create the schema, then should be switched to validate once tables
      # exist, to match staging's schema-drift protection (audit F34).
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: public

logging:
  level:
    root: WARN
    com.samjhana: INFO

---
# =============================================================================
# Staging Profile
# =============================================================================
# Shaped identically to prod, pointed at its own Supabase project. JWT_SECRET and the
# OCPP_SECRET_* charger secrets are intentionally NOT overridden here: they use the same
# property paths and env var names as every other profile (see the base block above), and
# get their own values from the staging Render service's own environment variables — the
# same mechanism that already keeps prod's secrets separate from dev's.
spring:
  config:
    activate:
      on-profile: staging

  datasource:
    # sslmode=verify-full, not just require: require only encrypts, it accepts ANY certificate
    # (including a forged one from a MITM), since it never checks who signed it or whether the
    # hostname matches. verify-full checks both, which is what actually stops a MITM. The
    # PostgreSQL driver checks against its own CA file, not the JVM truststore, and fails with
    # "Could not open SSL root certificate file" without one: upload Supabase's CA certificate
    # (Project Settings -> Database -> SSL Configuration) as a Render Secret File named
    # supabase-ca.crt, or point SUPABASE_SSL_ROOT_CERT at wherever it lives.
    url: jdbc:postgresql://${SUPABASE_STAGING_HOST}/${SUPABASE_STAGING_DB}?sslmode=verify-full&sslrootcert=${SUPABASE_SSL_ROOT_CERT:/etc/secrets/supabase-ca.crt}
    username: ${SUPABASE_STAGING_USER}
    password: ${SUPABASE_STAGING_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      # validate, not update: schema drift must be caught, not silently patched at boot
      # (audit F34). The staging Supabase project starts empty, so its schema must be put
      # in place by some other means before the first boot under this profile — this file
      # does not address that bootstrap step.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public

logging:
  level:
    root: WARN
    com.samjhana: INFO

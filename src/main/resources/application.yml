# =============================================================================
# SAMJHANA VENTURES OS - Application Configuration
# =============================================================================
# This is the main configuration file for the family business ERP system.
# The system is designed to run as a single JAR with embedded H2 database.
# =============================================================================

spring:
  application:
    name: Samjhana Ventures OS

  # =============================================================================
  # Database Configuration (H2 File-based for local dev — prod uses PostgreSQL)
  # Set DB_PASSWORD env var. The absence of a fallback default is intentional:
  # running without DB_PASSWORD in dev uses an empty string for the embedded H2,
  # which is acceptable for local-only data. Never run prod without DATABASE_PASSWORD.
  # =============================================================================
  datasource:
    url: jdbc:h2:file:./data/samjhana-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false

  # =============================================================================
  # JPA/Hibernate Configuration
  # =============================================================================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        types:
          print:
            banner: false

  # =============================================================================
  # File Upload Configuration
  # =============================================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # =============================================================================
  # Jackson JSON Configuration
  # =============================================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    time-zone: Asia/Kathmandu

# =============================================================================
# Server Configuration
# =============================================================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# =============================================================================
# Application-Specific Configuration
# =============================================================================
samjhana:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5175,http://localhost:8080

  security:
    jwt:
      # REQUIRED in production — set JWT_SECRET env var to a random 32+ byte value.
      # The dev fallback below is only for local development; it must never reach prod.
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-CHANGE-IN-PRODUCTION}
      expiration-hours: 168  # 7 days for Dad's convenience

  storage:
    images:
      path: ./data/images
      max-size-mb: 10
      allowed-extensions: jpg,jpeg,png,gif,webp

  business:
    default-timezone: Asia/Kathmandu
    currency: NPR

  i18n:
    default-locale: ne
    supported-locales: ne,en

  fuel-price-scraper:
    enabled: true
    depot: Bhalbari
    url: https://noc.org.np

  ocpp:
    default-lock-behavior: ${OCPP_LOCK_BEHAVIOR:EXPLICIT_UNLOCK}
    station-secrets:
      HD-D180-CC-01: ${OCPP_SECRET_HD_D180_CC_01:dev-HD-D180-CC-01-change-me}
      HQC23-80-01: ${OCPP_SECRET_HQC23_80_01:dev-HQC23-80-01-change-me}
      HD-D140-E-01: ${OCPP_SECRET_HD_D140_E_01:dev-HD-D140-E-01-change-me}

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level:
    root: INFO
    com.samjhana: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  file:
    name: ./logs/samjhana-os.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# =============================================================================
# Springdoc OpenAPI Configuration
# =============================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

---
# =============================================================================
# Development Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

  jpa:
    show-sql: true

server:
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.samjhana: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# =============================================================================
# Production Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # sslmode=verify-full, not just require: require only encrypts, it accepts ANY certificate
    # (including a forged one from a MITM), since it never checks who signed it or whether the
    # hostname matches. verify-full checks both, which is what actually stops a MITM. Supabase
    # uses a publicly-trusted CA cert, so this needs no extra CA configuration to work.
    url: jdbc:postgresql://${SUPABASE_PROD_HOST}/${SUPABASE_PROD_DB}?sslmode=verify-full
    username: ${SUPABASE_PROD_USER}
    password: ${SUPABASE_PROD_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      # Left overridable via Render's own DDL_AUTO env var (unlike staging, which hardcodes
      # validate) because this Supabase project starts empty: DDL_AUTO=update is needed for
      # the first boot to create the schema, then should be switched to validate once tables
      # exist, to match staging's schema-drift protection (audit F34).
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: public

logging:
  level:
    root: WARN
    com.samjhana: INFO
